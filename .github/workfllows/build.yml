name: APK derle

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dosyaları proje klasörlerine yerleştir
        run: |
          mkdir -p app/src/main/java/app/tini/player app/src/main/assets/www
          if [ -f app-build.gradle.kts ]; then mv app-build.gradle.kts app/build.gradle.kts; fi
          if [ -f AndroidManifest.xml ]; then mv AndroidManifest.xml app/src/main/AndroidManifest.xml; fi
          if [ -f MainActivity.kt ]; then mv MainActivity.kt app/src/main/java/app/tini/player/; fi
          if [ -f PlayService.kt ]; then mv PlayService.kt app/src/main/java/app/tini/player/; fi
          if [ -f index.html ]; then mv index.html app/src/main/assets/www/index.html; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Derle
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: tini-apk
          path: app/build/outputs/apk/debug/app-debug.apk
